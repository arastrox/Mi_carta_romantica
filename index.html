<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Cartita Especial Para Ti ❤️</title>
    <!-- Google Fonts for premium romantic styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas for floating fireflies and falling flower petals -->
    <canvas id="particle-canvas"></canvas>

    <!-- Floating flowers container (procedurally generated daily via JS) -->
    <div id="flowers-container"></div>

    <!-- Background dimming overlay when letter opens -->
    <div class="focus-overlay"></div>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Interactive Envelope -->
        <div class="envelope-wrapper" id="envelope-wrapper">
            <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                
                <!-- The Letter inside -->
                <div class="letter" id="letter">
                    <div class="letter-content">
                        <div class="letter-header">
                            <span class="letter-date" id="letter-date">Cargando fecha...</span>
                            <h2 class="letter-title">Para mi amor ❤️</h2>
                        </div>
                        <div class="letter-body">
                            <p id="letter-text" class="letter-text">
                                Esperando un mensaje especial...
                            </p>
                        </div>
                        <div class="letter-footer">
                            <p class="signature">Con todo mi amor,</p>
                            <p class="signature-name">Tu Novio 🌹</p>
                        </div>
                    </div>
                </div>

                <div class="envelope-front"></div>
                <div class="envelope-top" id="envelope-top"></div>
                
                <!-- Wax seal that serves as the trigger button to open -->
                <div class="wax-seal" id="wax-seal">
                    <svg viewBox="0 0 100 100" class="seal-svg">
                        <circle cx="50" cy="50" r="45" class="seal-outer" />
                        <circle cx="50" cy="50" r="38" class="seal-inner" />
                        <!-- Heart shape -->
                        <path d="M50 33 C45 23, 25 23, 25 43 C25 61, 50 78, 50 78 C50 78, 75 61, 75 43 C75 23, 55 23, 50 33 Z" class="seal-heart" />
                    </svg>
                    <span class="seal-prompt">Abrir</span>
                </div>
            </div>
        </div>

        <!-- Ambient music controller -->
        <div class="music-controller" id="music-btn" title="Activar/Desactivar Música">
            <svg viewBox="0 0 24 24" class="music-icon icon-off" id="music-icon-off">
                <path d="M4.27 3L3 4.27l9 9v.28c-.53-.34-1.14-.55-1.8-.55C8.36 13 6.8 14.57 6.8 16.5S8.36 20 10.2 20s3.4-1.57 3.4-3.5v-1.92l4.88 4.88 1.27-1.27L4.27 3zM10.2 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM14.2 7h2.8V3h-5.6v2.37l2.8 2.8V7zM18.8 8.63L20 7.42c-.88-.81-2.12-1.32-3.5-1.42v1.54c.78.11 1.49.46 2.3 1.09z" />
            </svg>
            <svg viewBox="0 0 24 24" class="music-icon icon-on hidden" id="music-icon-on">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6zm-2 16c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
            </svg>
        </div>

        <!-- HTML5 Audio Element (soft piano instrumental background) -->
        <audio id="ambient-audio" loop preload="auto">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
            <!-- Alternative royalty free track source if needed -->
        </audio>
    </main>

    <script src="app.js"></script>
</body>
</html>
